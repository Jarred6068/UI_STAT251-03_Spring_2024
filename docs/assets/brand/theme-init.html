<!--
  Pre-paint theme resolution. Included via `includes: in_header:` so it lands in
  <head> and runs synchronously before first paint - that is what prevents a
  flash of the wrong theme on load.

  We ALWAYS set data-theme (never leave it unset), which lets site.css express
  dark mode as a plain `:root[data-theme="dark"]` block with no duplicated
  @media (prefers-color-scheme) rules.
-->
<script>
(function () {
  var stored = null;
  // localStorage THROWS (not returns null) in Safari private browsing and in
  // some file:// contexts - which is exactly how these pages get previewed
  // locally. An uncaught throw here would leave data-theme unset and kill
  // every dark-mode rule on the page.
  try { stored = window.localStorage.getItem('stat251-theme'); } catch (e) { stored = null; }

  var theme = (stored === 'dark' || stored === 'light') ? stored :
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<!--
  MathJax 4, SVG output, with speech.

  WHY VERSION 4. The pages used to load MathJax 2.7 from mathjax.rstudio.com.
  Its SVG output is aria-hidden and has no spoken text. The only thing assistive
  technology got was a hidden MathML copy, which only a screen reader with a math
  module (NVDA + MathCAT, JAWS, VoiceOver) can voice. Read-aloud tools (Edge and
  Chrome Read Aloud, Read&Write, Speechify, phone Speak Screen) read nothing, or
  stray letters, for all ~6,000 expressions on the site. MathJax 4 runs Speech
  Rule Engine on every expression and attaches a natural-language label, e.g.
  "P of open paren X is greater than or equal to 2 close paren equals ...",
  that any text-to-speech tool or screen reader reads.

  WHY SVG. CHTML output (v2 HTML-CSS, and v3 CHTML) prints square-root bars too
  wide in headless Chrome: on the Exam 1 study guide the bar over
  sqrt( (1/(n-1)) sum (x_i - xbar)^2 ) ran past the expression into the line
  above. SVG draws it the right width; re-checked with v4 SVG before switching.

  The script URL itself is set by `mathjax:` in _site.yml and in every
  per-directory _output.yml (rmarkdown injects it at the end of <body>). This
  block has to be in <head> so window.MathJax exists before that script runs.
  Keep the version pinned and the same in all seven places.

  inTabOrder: false. MathJax makes every expression a Tab stop by default (for
  its keyboard explorer), which put ~300 Tab stops on a single lecture page in
  front of the links a keyboard user is trying to reach. Screen-reader users
  still reach every expression in browse mode, and the label is on the
  expression either way. It is options.a11y, NOT menuOptions.settings - the
  menu setting is accepted but ignored at startup.

  SVG output inherits currentColor, so both themes are unaffected (see the
  MathJax rule in assets/brand/site.css).
-->
<script>
window.MathJax = {
  options: { a11y: { inTabOrder: false } }
};
</script>
