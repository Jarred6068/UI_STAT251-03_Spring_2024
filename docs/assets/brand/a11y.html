<!--
  Structural accessibility patches. Included via `includes: after_body:` AFTER
  theme-toggle.html.

  Why a script and not markup: everything below has to change elements that
  pandoc's HTML template and rmarkdown's navbar generator emit. We do not own
  either template, and the navbar is rebuilt from _site.yml on every render, so
  a hand-edit would be overwritten. Patching the parsed DOM is the only place
  these fixes survive a rebuild.

  Why a SEPARATE file rather than appending to theme-toggle.html: that file's
  header documents two load-bearing ordering constraints. Leave it alone.

  Same synchronous-during-parsing guarantee that theme-toggle.html relies on -
  no DOMContentLoaded, no defer. By the time an after_body script runs, the
  navbar and .main-container are already in the DOM, and we are still ahead of
  jQuery's ready queue.

  EVERY lookup is null-guarded: 29 subdirectory pages (homeworks/, misc/,
  study_guides/, Review_problems/) render without a navbar, and this file loads
  on those too.
-->
<script>
(function () {
  /* 1. Main landmark + skip-link target (WCAG 1.3.1, 2.4.1).
        pandoc emits no <main> at all; the content lives in a bare div.
        tabindex="-1" is what makes the skip link MOVE FOCUS rather than merely
        scroll - without it Chrome and Safari scroll and leave focus on <body>,
        so the next Tab drops the user back at the top of the navbar. */
  var main = document.querySelector('.main-container');
  if (main) {
    if (!main.id) main.id = 'main-content';
    main.setAttribute('role', 'main');
    main.setAttribute('tabindex', '-1');
  }

  var navbar = document.querySelector('.navbar');

  /* 2. Name the hamburger (WCAG 4.1.2). rmarkdown emits the button with three
        empty <span class="icon-bar"> and no text and no label, so screen
        readers announce a bare "button". */
  var toggle = document.querySelector('.navbar-toggle');
  if (toggle) {
    toggle.setAttribute('aria-label', 'Toggle navigation');
    var target = (toggle.getAttribute('data-target') || '').replace(/^#/, '');
    if (target) toggle.setAttribute('aria-controls', target);
  }

  /* 3. Dropdown triggers advertise that they open something.
        Bootstrap 3.3.5's own JS already maintains aria-expanded, so we only
        add what it does not: aria-haspopup. */
  var togglers = document.querySelectorAll('.navbar .dropdown-toggle');
  for (var i = 0; i < togglers.length; i++) {
    togglers[i].setAttribute('aria-haspopup', 'true');
  }

  /* 4. Drop the broken ARIA menu pattern (WCAG 4.1.2).
        rmarkdown puts role="menu" on the dropdown <ul> but never gives the
        children role="menuitem". A menu with no menuitems is announced as an
        empty menu - strictly worse than no role, because it suppresses the
        list semantics the plain <ul>/<a> markup would otherwise expose.
        Removing the role is correct and far cheaper than implementing the
        full APG menubar pattern (roving tabindex, arrow keys, Escape). */
  var menus = document.querySelectorAll('.navbar [role="menu"]');
  for (var j = 0; j < menus.length; j++) {
    menus[j].removeAttribute('role');
  }

  /* 5. Escape hatch for the navbar-less pages (WCAG 2.4.5, 3.2.3).
        The subdirectory pages are rendered outside render_site() and never see
        the _site.yml navbar, so a reader who followed a menu link into one has
        no way back except the browser's Back button - and no way at all if
        they arrived from a bookmark or a direct link.

        How far up docs/index.html is depends on the directory. Most pages sit
        one level below docs/, but homeworks/<year>/ and Examinations/<term>/
        are two levels down, and '../index.html' 404s from those. The page
        cannot measure this for itself - it is rendered self-contained, so every
        asset is inlined and no relative URL survives in the markup - so the
        deeper directories declare it by including assets/brand/site-depth-2.html
        ahead of this file in their _output.yml. Default is 1.

        This branch cannot run on a top-level page: those all have a navbar. */
  if (!navbar && main) {
    var depth = window.__siteDepth || 1;
    var prefix = '';
    for (var d = 0; d < depth; d++) { prefix += '../'; }
    var bar = document.createElement('div');
    bar.className = 'site-backlink-bar';
    var link = document.createElement('a');
    link.className = 'site-backlink';
    link.href = prefix + 'index.html';
    link.textContent = '\u2190 Back to course site';
    bar.appendChild(link);
    main.insertBefore(bar, main.firstChild);
  }

  /* 6. Author / date are not headings (WCAG 1.3.1, 2.4.6).
        pandoc's template emits them as <h4 class="author"> and
        <h4 class="date"> straight after the <h1> title. Screen-reader users
        navigating by heading hear "heading level 4, STAT 251 Section 01" as if
        it were a section, and it puts an h1 -> h4 skip at the top of every
        page. Re-tag them as paragraphs; site.css styles them by class. */
  var meta = document.querySelectorAll('#header h4.author, #header h4.date');
  for (var k = 0; k < meta.length; k++) {
    var h4 = meta[k];
    var p = document.createElement('p');
    p.className = h4.className;
    while (h4.firstChild) p.appendChild(h4.firstChild);
    h4.parentNode.replaceChild(p, h4);
  }

  /* 7. Solution answers carry more than colour (WCAG 1.4.1, 1.4.3).
        Answers are marked three ways across the solution pages: an inline
        style="color: red", the RA/RZ <div style="color: red;"> helper, and
        class="soln". Colour was the only cue, so a screen reader, a
        read-aloud tool, or a colour-blind reader could not tell the answer
        from the question. Each one gets class .answer (site.css section 20b:
        AA-contrast red, shaded box) and a screen-reader-only "Answer:" label.
        The label goes on the outermost answer element only, so an answer
        that contains another red span is announced once. Matching the inline
        style here rather than editing the sources keeps the 2024 archive
        untouched. */
  /* el.style.color rather than a [style*=...] selector, which would also catch
     background-color and border-color. Empty placeholder spans are skipped so
     they do not render as an empty shaded box. */
  var candidates = document.querySelectorAll('.main-container .soln, .main-container [style*="color"]');
  var answers = [];
  for (var a = 0; a < candidates.length; a++) {
    var c = candidates[a];
    var isRed = c.style.color === 'red' || c.style.color === 'rgb(255, 0, 0)';
    if (!isRed && !c.classList.contains('soln')) continue;
    if (!c.textContent.replace(/\s+/g, '') && !c.querySelector('img, svg')) continue;
    c.classList.add('answer');
    answers.push(c);
  }
  for (var b = 0; b < answers.length; b++) {
    var el = answers[b];
    if (el.parentNode.closest && el.parentNode.closest('.answer')) continue;
    var label = document.createElement('span');
    label.className = 'sr-only';
    label.textContent = 'Answer: ';
    el.insertBefore(label, el.firstChild);
  }

  /* 8. The decorative arrow in the back link (item 5) is read aloud as
        "leftwards arrow". */
  var back = document.querySelector('.site-backlink');
  if (back) {
    back.textContent = '';
    var arrow = document.createElement('span');
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '\u2190 ';
    back.appendChild(arrow);
    back.appendChild(document.createTextNode('Back to course site'));
  }
})();
</script>
